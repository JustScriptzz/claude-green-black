name: Build Claude Green Black APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Install apktool 2.9.3
        run: |
          wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool             -O /usr/local/bin/apktool
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar             -O /usr/local/bin/apktool.jar
          chmod +x /usr/local/bin/apktool
          apktool --version

      - name: Download Claude APK from APKPure
        run: |
          wget -q             --user-agent="Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 Chrome/120.0.0.0 Mobile Safari/537.36"             --header="Referer: https://apkpure.com/"             "https://d.apkpure.com/b/APK/com.anthropic.claude?version=latest"             -O claude.apk
          ls -lh claude.apk
          file claude.apk

      - name: Decode APK (resources only, skip smali)
        run: apktool d claude.apk -o decoded --no-src --force

      - name: Patch green-black theme
        run: |
          # main
          cp patches/values/colors.xml decoded/res/values/colors.xml
          # night
          mkdir -p decoded/res/values-night decoded/res/values-night-v31
          cp patches/values-night/colors.xml decoded/res/values-night/colors.xml
          cp patches/values-night/colors.xml decoded/res/values-night-v31/colors.xml
          echo "patch applied"

      - name: Rebuild APK
        run: |
          apktool b decoded -o claude-unsigned.apk --use-aapt2
          ls -lh claude-unsigned.apk

      - name: Zipalign
        run: |
          ${ANDROID_HOME}/build-tools/$(ls ${ANDROID_HOME}/build-tools | sort -V | tail -1)/zipalign             -v 4 claude-unsigned.apk claude-aligned.apk

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v             -keystore debug.keystore             -alias debugkey             -keyalg RSA -keysize 2048 -validity 10000             -storepass android -keypass android             -dname "CN=JustScriptzz, OU=Mod, O=JustScriptzz, L=IT, S=IT, C=IT"

      - name: Sign APK
        run: |
          BTVER=$(ls ${ANDROID_HOME}/build-tools | sort -V | tail -1)
          ${ANDROID_HOME}/build-tools/${BTVER}/apksigner sign             --ks debug.keystore             --ks-pass pass:android             --key-pass pass:android             --ks-key-alias debugkey             --out claude-green-black.apk             claude-aligned.apk
          ls -lh claude-green-black.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-green-black
          path: claude-green-black.apk
          retention-days: 30
